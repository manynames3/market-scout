name: Android Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed APK & App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure the four Android signing secrets documented in docs/android.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/market-scout.jks"
      - name: Validate and build signed artifacts
        working-directory: android
        env:
          MARKET_SCOUT_KEYSTORE: ${{ runner.temp }}/market-scout.jks
          MARKET_SCOUT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MARKET_SCOUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MARKET_SCOUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify android/app/build/outputs/apk/release/app-release.apk"
      - name: Upload signed APK and App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: market-scout-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/market-scout.jks"
